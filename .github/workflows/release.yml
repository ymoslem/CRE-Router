name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actions/checkout stores the pushed tag as a lightweight tag; fetch the
      # annotated tag object, whose message holds the release notes.
      - run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      # Checked before anything is published, so a tag without notes stops here.
      - run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag; its message holds the release notes"
            exit 1
          fi
          if [ -z "$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)')" ]; then
            echo "::error::the message of $GITHUB_REF_NAME has no body after its first line"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # A tag checkout is clean by construction, so the sdist cannot pick up
      # untracked working files the way a laptop build can.
      - run: pip install build check-manifest pytest -e .
      - run: check-manifest
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mint the OIDC token PyPI trusted publishing verifies
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # Actual repository release. Without this the package reaches PyPI while the
  # repository still shows the previous version as latest.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      # The notes are the tag message after its first line.
      - run: git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)' > notes.md
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # A release written by hand before the tag is pushed keeps its notes and
      # gets the packages attached, rather than failing on the duplicate.
      - run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
